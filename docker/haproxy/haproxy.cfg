# Routes clients to the Patroni cluster.
#   :5000 -> the primary  (health check: Patroni REST OPTIONS /primary)
#   :5001 -> the replicas (health check: Patroni REST OPTIONS /replica)
#   :7000 -> stats page
#
# Server addresses are resolved through Docker's embedded DNS at run time, so a
# node that is killed and restarted with a new IP is picked up again.

global
    maxconn 1000
    log stdout format raw local0 info

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

listen primary
    bind *:5000
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg-1 pg-1:5432 maxconn 100 check port 8008
    server pg-2 pg-2:5432 maxconn 100 check port 8008
    server pg-3 pg-3:5432 maxconn 100 check port 8008

listen replicas
    bind *:5001
    balance roundrobin
    option httpchk OPTIONS /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg-1 pg-1:5432 maxconn 100 check port 8008
    server pg-2 pg-2:5432 maxconn 100 check port 8008
    server pg-3 pg-3:5432 maxconn 100 check port 8008
