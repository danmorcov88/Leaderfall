# Scraped every 2 s: the failover timings the lab measures are in the tens of seconds,
# and a 15 s default would blur them on the dashboard.
global:
  scrape_interval: 2s
  evaluation_interval: 15s

scrape_configs:
  - job_name: patroni
    metrics_path: /metrics
    static_configs:
      - targets: ["pg-1:8008", "pg-2:8008", "pg-3:8008"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "(pg-[0-9]+):.*"
        target_label: node
        replacement: "$1"

  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets: ["haproxy:7000"]

  - job_name: etcd
    metrics_path: /metrics
    static_configs:
      - targets: ["etcd-1:2379", "etcd-2:2379", "etcd-3:2379"]
