name: planned-switchover
description: Patroni switchover to another node. A planned role change should cost seconds, not tens of seconds.
tags: [core]
cluster:
  patroni_profile: default
  synchronous_mode: false
workload:
  rate_per_sec: 50
  warmup_sec: 15
steps:
  - fault: switchover
    target: primary
  - wait_for: new_leader
    timeout_sec: 90
  - wait_for: writes_ok
    timeout_sec: 60
  - wait_for: cluster_healthy     # the old primary comes back as a replica by itself
    timeout_sec: 120
  - hold_sec: 10
expect:
  failover: true
  rto_write_sec_max: 20
  lost_acked_commits_max: 0
  split_brain: false
  final_topology: 1-leader-2-replicas
