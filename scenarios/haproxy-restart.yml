name: haproxy-restart
description: Restart HAProxy. The database does nothing; clients must reconnect once the proxy is back.
tags: [core]
cluster:
  patroni_profile: default
  synchronous_mode: false
workload:
  rate_per_sec: 50
  warmup_sec: 15
steps:
  - fault: restart_service
    target: haproxy
    grace_sec: 5
  - wait_for: writes_ok
    timeout_sec: 60
  - hold_sec: 10
expect:
  failover: false
  rto_write_sec_max: 15
  lost_acked_commits_max: 0
  detection_sec_max: null
  rejoin_sec_max: null
  split_brain: false
  final_topology: 1-leader-2-replicas
