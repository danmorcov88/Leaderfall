name: wal-disk-full
description: The WAL volume of the primary fills up. PostgreSQL panics when it cannot write WAL; Patroni must fail over; the node recovers once space is freed. Needs a bounded pg_wal volume (see the runbook); tagged bounded-wal, not advanced.
tags: [bounded-wal]
cluster:
  patroni_profile: default
  synchronous_mode: false
workload:
  rate_per_sec: 50
  warmup_sec: 15
steps:
  - fault: fill_disk               # refuses unless pg_wal is on a bounded filesystem
    target: primary
  - wait_for: new_leader
    timeout_sec: 120
  - wait_for: writes_ok
    timeout_sec: 60
  - hold_sec: 10
  - action: free_disk
    target: failed_node
  - wait_for: node_streaming
    timeout_sec: 240
expect:
  failover: true
  lost_acked_commits_max: null
  split_brain: false
  final_topology: 1-leader-2-replicas
