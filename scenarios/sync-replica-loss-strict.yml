name: sync-replica-loss-strict
description: Strict synchronous mode; the sync standby dies. Patroni may only move the sync role to a healthy replica, never drop it; writes stall until then.
tags: [advanced, sync]
cluster:
  patroni_profile: default
  synchronous_mode: strict
workload:
  rate_per_sec: 50
  warmup_sec: 15
steps:
  - fault: kill
    target: sync_replica
    signal: SIGKILL
  - wait_for: writes_ok
    timeout_sec: 90
  - hold_sec: 15
  - action: start
    target: failed_node
  - wait_for: cluster_healthy
    timeout_sec: 180
expect:
  failover: false
  detection_sec_max: null
  rto_write_sec_max: 30
  ack_gap_sec_max: 15             # commits stall (no errors) until Patroni re-picks the sync standby
  lost_acked_commits_max: 0
  split_brain: false
  final_topology: 1-leader-2-replicas
