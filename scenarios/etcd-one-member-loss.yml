name: etcd-one-member-loss
description: One etcd member dies. The DCS keeps quorum; the database must not notice.
tags: [advanced]
cluster:
  patroni_profile: default
  synchronous_mode: false
workload:
  rate_per_sec: 50
  warmup_sec: 15
steps:
  - fault: kill
    target: etcd-1
    signal: SIGKILL
  - hold_sec: 45                  # longer than ttl: every Patroni loop runs against a 2-member etcd
  - action: start
    target: etcd-1
  - wait_for: cluster_healthy
    timeout_sec: 120
  - hold_sec: 10
expect:
  failover: false
  rto_write_sec_max: 1            # not one write may fail
  lost_acked_commits_max: 0
  detection_sec_max: null
  rejoin_sec_max: null
  split_brain: false
  final_topology: 1-leader-2-replicas
