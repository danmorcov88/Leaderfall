name: fast-profile-primary-sigkill
description: Same as primary-sigkill with the fast Patroni profile (ttl 20, Patroni's minimum / loop_wait 5 / retry_timeout 5).
tags: [advanced]
cluster:
  patroni_profile: fast
  synchronous_mode: false
workload:
  rate_per_sec: 50
  warmup_sec: 15
steps:
  - fault: kill
    target: primary
    signal: SIGKILL
  - wait_for: new_leader
    timeout_sec: 60
  - wait_for: writes_ok
    timeout_sec: 60
  - hold_sec: 10
  - action: start
    target: failed_node
  - wait_for: node_streaming
    timeout_sec: 180
expect:
  failover: true
  lost_acked_commits_max: null
  split_brain: false
  final_topology: 1-leader-2-replicas
