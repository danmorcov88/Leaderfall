<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- harness -->
  <rect x="30" y="30" width="230" height="130" rx="10" fill="#f8fafc" stroke="#98a2b3"/>
  <text x="145" y="56" text-anchor="middle" font-weight="600">leaderfall (host)</text>
  <text x="145" y="80" text-anchor="middle" fill="#475467">writer + reader + ledger</text>
  <text x="145" y="100" text-anchor="middle" fill="#475467">node poller (direct, docker exec)</text>
  <text x="145" y="120" text-anchor="middle" fill="#475467">faults: kill, stop, pause, partition, ...</text>
  <text x="145" y="140" text-anchor="middle" fill="#475467">metrics, SLO, reports</text>

  <!-- haproxy -->
  <rect x="340" y="40" width="240" height="110" rx="10" fill="#eef4ff" stroke="#175cd3"/>
  <text x="460" y="66" text-anchor="middle" font-weight="600" fill="#175cd3">HAProxy</text>
  <text x="460" y="90" text-anchor="middle" fill="#344054">:5000 writes → primary</text>
  <text x="460" y="110" text-anchor="middle" fill="#344054">:5001 reads → replicas</text>
  <text x="460" y="130" text-anchor="middle" fill="#667085">checks: Patroni REST /primary, /replica</text>

  <!-- workload arrows -->
  <line x1="260" y1="80" x2="336" y2="80" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="72" text-anchor="middle" fill="#667085" font-size="12">workload</text>

  <!-- monitoring -->
  <rect x="640" y="40" width="230" height="110" rx="10" fill="#f8fafc" stroke="#98a2b3" stroke-dasharray="6,4"/>
  <text x="755" y="66" text-anchor="middle" font-weight="600">monitoring (optional)</text>
  <text x="755" y="90" text-anchor="middle" fill="#475467">Prometheus :9090</text>
  <text x="755" y="110" text-anchor="middle" fill="#475467">Grafana :3000, annotations</text>
  <text x="755" y="130" text-anchor="middle" fill="#667085">Patroni, HAProxy, etcd /metrics</text>

  <!-- pg nodes -->
  <g id="pg">
    <rect x="200" y="230" width="150" height="90" rx="10" fill="#e6f4ea" stroke="#157f3b"/>
    <text x="275" y="256" text-anchor="middle" font-weight="600" fill="#157f3b">pg-1</text>
    <text x="275" y="278" text-anchor="middle" fill="#344054">Patroni :8008</text>
    <text x="275" y="298" text-anchor="middle" fill="#344054">PostgreSQL 17 :5432</text>
  </g>
  <g>
    <rect x="375" y="230" width="150" height="90" rx="10" fill="#f8fafc" stroke="#98a2b3"/>
    <text x="450" y="256" text-anchor="middle" font-weight="600">pg-2</text>
    <text x="450" y="278" text-anchor="middle" fill="#344054">Patroni :8008</text>
    <text x="450" y="298" text-anchor="middle" fill="#344054">PostgreSQL 17 :5432</text>
  </g>
  <g>
    <rect x="550" y="230" width="150" height="90" rx="10" fill="#f8fafc" stroke="#98a2b3"/>
    <text x="625" y="256" text-anchor="middle" font-weight="600">pg-3</text>
    <text x="625" y="278" text-anchor="middle" fill="#344054">Patroni :8008</text>
    <text x="625" y="298" text-anchor="middle" fill="#344054">PostgreSQL 17 :5432</text>
  </g>
  <text x="275" y="340" text-anchor="middle" fill="#157f3b" font-size="12">leader (any node can be)</text>
  <text x="700" y="358" text-anchor="end" fill="#667085" font-size="12">replicas (pg_rewind on rejoin)</text>

  <!-- haproxy -> pg -->
  <line x1="430" y1="150" x2="290" y2="226" stroke="#175cd3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="150" x2="455" y2="226" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="150" x2="610" y2="226" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- harness -> direct ports -->
  <path d="M60,160 L60,275 L196,275" fill="none" stroke="#667085" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="66" y="215" fill="#667085" font-size="12">direct ports 5441–5443</text>
  <text x="66" y="231" fill="#667085" font-size="12">and REST 8011–8013:</text>
  <text x="66" y="247" fill="#667085" font-size="12">ground truth per node</text>

  <!-- etcd -->
  <rect x="230" y="385" width="130" height="60" rx="10" fill="#fff7e6" stroke="#b54708"/>
  <text x="295" y="410" text-anchor="middle" font-weight="600" fill="#b54708">etcd-1</text>
  <text x="295" y="430" text-anchor="middle" fill="#344054" font-size="12">:2379</text>
  <rect x="385" y="385" width="130" height="60" rx="10" fill="#fff7e6" stroke="#b54708"/>
  <text x="450" y="410" text-anchor="middle" font-weight="600" fill="#b54708">etcd-2</text>
  <text x="450" y="430" text-anchor="middle" fill="#344054" font-size="12">:2379</text>
  <rect x="540" y="385" width="130" height="60" rx="10" fill="#fff7e6" stroke="#b54708"/>
  <text x="605" y="410" text-anchor="middle" font-weight="600" fill="#b54708">etcd-3</text>
  <text x="605" y="430" text-anchor="middle" fill="#344054" font-size="12">:2379</text>
  <text x="690" y="412" fill="#667085" font-size="12">DCS: leader lease (ttl),</text>
  <text x="690" y="428" fill="#667085" font-size="12">member keys, dynamic config</text>

  <!-- pg -> etcd -->
  <line x1="275" y1="320" x2="295" y2="381" stroke="#b54708" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="320" x2="450" y2="381" stroke="#b54708" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="625" y1="320" x2="605" y2="381" stroke="#b54708" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- replication -->
  <path d="M350,262 L371,262" stroke="#157f3b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M350,300 C420,360 560,360 610,324" fill="none" stroke="#157f3b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="372" text-anchor="middle" fill="#157f3b" font-size="12">streaming replication</text>

  <!-- docker network -->
  <rect x="180" y="200" width="700" height="260" rx="12" fill="none" stroke="#d0d5dd" stroke-dasharray="3,5"/>
  <text x="870" y="216" text-anchor="end" fill="#98a2b3" font-size="12">one Docker Compose network: leaderfall</text>
</svg>
