name: chaos-nightly

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC every night
  workflow_dispatch:

permissions:
  contents: write   # to update the results table in README.md
  pages: write
  id-token: write

concurrency:
  group: chaos-nightly
  cancel-in-progress: false

jobs:
  suite:
    name: full suite (core + advanced)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: make install

      - name: Start the cluster
        run: make up

      - name: Run the suite
        id: suite
        continue-on-error: true   # a failed scenario is a result, and it still gets published
        run: .venv/bin/leaderfall run --all --tag core,advanced

      - name: Build the report site and update the README table
        run: .venv/bin/leaderfall report --site site --update-readme

      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color --timestamps > reports/compose.log 2>&1 || true

      - name: Upload raw reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Commit the README table
        run: |
          git config user.name "Dan Morcov"
          git config user.email "danmorcov88@gmail.com"
          if git diff --quiet README.md; then echo "README unchanged"; exit 0; fi
          git add README.md
          git commit -m "docs: nightly results $(date -u +%Y-%m-%d)"
          # main may have moved during the 15-minute suite: rebase, then push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Stop the cluster
        if: always()
        run: make down VOLUMES=1

      - name: Fail the job if the suite failed
        if: steps.suite.outcome == 'failure'
        run: exit 1

  deploy:
    name: publish to GitHub Pages
    needs: suite
    if: always() && needs.suite.result != 'cancelled'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
