name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: lint + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  smoke:
    name: smoke (primary-sigkill on a real cluster)
    needs: lint-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: make install

      - name: Start the cluster
        run: make up

      - name: Cluster checks
        run: .venv/bin/pytest -m integration -q

      - name: Run primary-sigkill
        run: make chaos

      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color --timestamps > reports/compose.log 2>&1 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the cluster
        if: always()
        run: make down VOLUMES=1
